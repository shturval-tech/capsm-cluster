apiVersion: v2
name: capsm-cluster
description: Helm-чарт для развёртывания Cluster API-кластера на провайдере Shturval (CAPSM, bare metal) + Shturval ClusterConfig
type: application
version: 0.3.1
appVersion: "2.15.0"
dependencies:
  - name: capsm-cluster-vm
    version: 0.1.0
    repository: capsm-cluster-vm
    condition: capsm-cluster-vm.enable
  - name: capsm-cluster-grafana
    version: 0.1.0
    repository: capsm-cluster-grafana
    condition: capsm-cluster-grafana.enable
