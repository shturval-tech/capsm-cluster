apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capsm-cluster.capsm.profileName" . }}-capsm-v2-provider-secret
  namespace: shturval-capsm
  labels:
    {{- include "capsm-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  sshKey: {{ include "capsm-cluster.sshKey" . }}
  sshUser: {{ .Values.capsm.sshUser | b64enc | quote }}

