apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: ShturvalMachineTemplate
metadata:
  name: {{ .Release.Name }}-control-plane
  namespace: {{ .Release.Name }}
  labels:
    cluster-name: {{ .Release.Name }}
    cluster.x-k8s.io/cluster-name: {{ .Release.Name }}
    cluster.x-k8s.io/control-plane: "true"
    {{- include "capsm-cluster.labels" . | nindent 4 }}
spec:
  template:
    spec:
      {{- with .Values.master.hostSelector }}
      hostSelector: 
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
      nodeType: master
      providerConfigName: {{ include "capsm-cluster.capsm.profileName" . }}