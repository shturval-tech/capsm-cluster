{{- if .Values.secure }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-encryption-configuration
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capsm-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ include "capsm-cluster.encryptionKey" . | b64enc }}
{{- end }}
